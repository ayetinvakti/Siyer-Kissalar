<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        // Tema ve Özel Renk Paleti Kontrolü (Titremeyi önlemek için en başta çalışır)
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
            document.body && document.body.classList.add('light-mode');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Siyer-i Nebi | Ayetin Vakti</title>
    
    <meta property="og:title" content="Siyer-i Nebi | Ayetin Vakti">
    <meta property="og:description" content="Peygamber Efendimiz'in (SAV) hayatı, örnek ahlakı ve mübarek kıssalar.">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-hover: #047857;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        html.light-mode, body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --accent-hover: #047857;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            position: relative;
        }

        [dir="rtl"] .navbar {
            flex-direction: row-reverse;
        }

        .nav-right-group {
            display: flex;
            gap: 8px;
        }

        .home-btn, .theme-icon-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover, .theme-icon-btn:hover {
            background-color: var(--btn-hover);
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Sekmeler / Kategoriler (Dönemler) */
        .category-tabs {
            width: 100%;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        /* Konu Listesi Kartları */
        .content-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .siyer-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.1s ease;
        }

        .siyer-card:active {
            transform: scale(0.98);
        }

        .siyer-card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .siyer-card-title span.badge {
            font-size: 0.7rem;
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 8px;
            color: var(--accent-color);
            font-weight: 500;
        }

        .siyer-card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Detay Okuma Modal / Paneli */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
        }

        .modal-sheet {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px 35px 20px;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .modal-title-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .close-modal-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-color);
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <a href="../" class="home-btn" title="Ana Sayfa">←</a>
        <div class="nav-right-group">
            <button class="theme-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">☀️</button>
        </div>
    </div>

    <div class="header">
        <h1 data-i18n="main_title">Siyer-i Nebi</h1>
        <p data-i18n="brand_subtitle">Peygamber Efendimiz’in (SAV) Hayatı ve Kıssalar</p>
    </div>

    <!-- Dönem Sekmeleri -->
    <div class="category-tabs" id="categoryTabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)" data-i18n="tab_all">Tümü</button>
        <button class="tab-btn" onclick="filterCategory('dogus', this)" data-i18n="tab_dogus">Doğuşu ve Çocukluğu</button>
        <button class="tab-btn" onclick="filterCategory('risalet', this)" data-i18n="tab_risalet">Mekke Dönemi</button>
        <button class="tab-btn" onclick="filterCategory('medine', this)" data-i18n="tab_medine">Medine Dönemi</button>
        <button class="tab-btn" onclick="filterCategory('veda', this)" data-i18n="tab_veda">Veda Hutbesi ve Vefat</button>
    </div>

    <!-- Konu Kartları Listesi -->
    <div class="content-list" id="contentList">
        <!-- Javascript ile Dinamik Dolacak -->
    </div>
</div>

<!-- Detay Okuma Paneli -->
<div class="modal-overlay" id="detailModal" onclick="closeModalOutside(event)">
    <div class="modal-sheet">
        <div class="modal-header-row">
            <div class="modal-title-text" id="modalTitle">Konu Başlığı</div>
            <button class="close-modal-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body-text" id="modalBody">
            İçerik buraya gelecek...
        </div>
    </div>
</div>

<script>
    const translations = {
        tr: {
            page_title: "Siyer-i Nebi | Ayetin Vakti",
            main_title: "Siyer-i Nebi",
            brand_subtitle: "Peygamber Efendimiz’in (SAV) Hayatı ve Kıssalar",
            tab_all: "Tümü",
            tab_dogus: "Doğuşu ve Çocukluğu",
            tab_risalet: "Mekke Dönemi",
            tab_medine: "Medine Dönemi",
            tab_veda: "Veda ve Vefat"
        },
        en: {
            page_title: "Seerah | Ayetin Vakti",
            main_title: "Prophet's Life",
            brand_subtitle: "Life of Prophet Muhammad (PBUH)",
            tab_all: "All",
            tab_dogus: "Early Life",
            tab_risalet: "Meccan Period",
            tab_medine: "Medinan Period",
            tab_veda: "Farewell & Passing"
        },
        ar: {
            page_title: "السيرة النبوية | آية الوقت",
            main_title: "السيرة النبوية",
            brand_subtitle: "حياة النبي محمد صلى الله عليه وسلم",
            tab_all: "الكل",
            tab_dogus: "النشأة والطفولة",
            tab_risalet: "العهد المكي",
            tab_medine: "العهد المدني",
            tab_veda: "حجة الوداع والوفاة"
        }
    };

    const activeLang = localStorage.getItem('user_lang') || 'tr';
    const t = translations[activeLang] || translations['tr'];

    // Örnek Siyer Veritabanı (Usta buraya istediğin kadar detay ekleyebilirsin)
    const siyerData = [
        {
            id: 1,
            category: 'dogus',
            titleTr: "Dünyaya Teşrifleri (Amûl-Fîl)",
            titleEn: "Birth of the Prophet",
            titleAr: "مولد النبي صلى الله عليه وسلم",
            badgeTr: "Doğuş", badgeEn: "Birth", badgeAr: "مولد",
            descTr: "Peygamber Efendimiz Hz. Muhammed (SAV), Rebiülevvel ayının 12. gecesi (Fîl Vak'ası'ndan 50-55 gün sonra) Mekke'de dünyaya teşrif ettiler.",
            descEn: "Prophet Muhammad (PBUH) was born in Mecca on the 12th night of Rabi' al-Awwal.",
            descAr: "وُلد النبي محمد صلى الله عليه وسلم في مكة المكرمة في فجر يوم الاثنين...",
            contentTr: "Peygamber Efendimiz Hz. Muhammed (SAV), miladi 571 yılı, Rebiülevvel ayının 12. Pazartesi gecesi Mekke'de dünyaya geldi. Babası Abdullah, o doğmadan önce vefat etmişti. Annesi Âmine Hatun, dedesi ise Abdülmuttalip'tir.\n\nDoğumu sırasında âlemde birçok mucize gerçekleşti; İran sarayının sütunları sarsıldı, Mecusilerin bin yıldır yanan kutsal ateşi söndü.",
            contentEn: "Detailed English text about the birth...",
            contentAr: "النص التفصيلي باللغة العربية عن مولد النبي..."
        },
        {
            id: 2,
            category: 'risalet',
            titleTr: "İlk Vahiy: Hira Mağarası",
            titleEn: "First Revelation: Cave of Hira",
            titleAr: "الوحي الأول: غار حراء",
            badgeTr: "Risalet", badgeEn: "Revelation", badgeAr: "الوحي",
            descTr: "40 yaşındayken Hira Mağarası'nda Melek Cebrail (AS) aracılığıyla ilk vahiy olan 'Oku!' emri nazil oldu.",
            descEn: "At the age of 40, the first revelation 'Read!' was sent down in the Cave of Hira.",
            descAr: "في سن الأربعين، نزلت أول آيات القرآن الكريم في غار حراء...",
            contentTr: "Hz. Muhammed (SAV) 40 yaşına geldiğinde, ibadet etmek için Mekke yakınlarındaki Nur Dağı'nda bulunan Hira Mağarası'na gitmeyi adet edinmişti.\n\nMiladi 610 yılı Ramazan ayında Cebrail (AS) gelerek 'Oku!' (Alak Suresi 1. ayet) buyurdu. Efendimiz 'Ben okuma bilmem' deyince melek onu kucakladı ve bu üç kez tekrarlandı.",
            contentEn: "Detailed English text about first revelation...",
            contentAr: "النص التفصيلي باللغة العربية عن نزول الوحي..."
        },
        {
            id: 3,
            category: 'medine',
            titleTr: "Hicret ve Medine Mescidi",
            titleEn: "Hijra and Mosque of Medina",
            titleAr: "الهجرة النبوية وبناء المسجد",
            badgeTr: "Medine", badgeEn: "Medina", badgeAr: "هجرة",
            descTr: "Mekke'deki baskı ve zulümlerin artması üzerine Müslümanlar Medine'ye hicret etti ve İslam devleti temelleri atıldı.",
            descEn: "Due to increasing oppression in Mecca, Muslims migrated to Medina.",
            descAr: "بسبب اشتداد الأذى في مكة، هاجر المسلمون إلى المدينة المنورة...",
            contentTr: "Müslümanlara yapılan baskıların artması üzerine Allah Teâlâ'nın izniyle Hz. Muhammed (SAV) ve Hz. Ebû Bekir, Sevr Mağarası'ndaki mucizevi korumanın ardından Medine'ye ulaştılar.\n\nMedine'de ilk iş olarak Mescid-i Nebevi inşa edildi ve Evs ile Hazreç kabileleri kardeş ilan edildi.",
            contentEn: "Detailed English text about Hijra...",
            contentAr: "النص التفصيلي باللغة العربية عن الهجرة..."
        },
        {
            id: 4,
            category: 'veda',
            titleTr: "Veda Hutbesi ve Ebedî Âlem",
            titleEn: "Farewell Sermon & Passing",
            titleAr: "خطبة الوداع والالتحاق بالرفيق الأعلى",
            badgeTr: "Veda", badgeEn: "Farewell", badgeAr: "الوداع",
            descTr: "Hicretin 10. yılında yüz bin sahâbiyle birlikte yaptığı hac ibadetinde insanlığa evrensel insan hakları evrensel bildirgesini sundu.",
            descEn: "During the Farewell Pilgrimage, the Prophet delivered his historic sermon.",
            descAr: "في حجة الوداع، ألقى النبي صلى الله عليه وسلم خطبته التاريخية...",
            contentTr: "Peygamber Efendimiz (SAV) hicretin 10. yılında hayatının tek haccı olan Veda Haccı'nı gerçekleştirdi ve Arafat'ta 100 binden fazla Müslümana o meşhur Veda Hutbesi'ni irad buyurdu.\n\n'İnsanlar! Kanlarınız, mallarınız, ırklarınız rabbinizin katında kutsaldır...' buyurarak evrensel hakları ilan etti. Aynı yılın Rebiülevvel ayında Yüce Rabbimize kavuştu.",
            contentEn: "Detailed English text about Farewell sermon...",
            contentAr: "النص التفصيلي باللغة العربية عن خطبة الوداع..."
        }
    ];

    const themeBtn = document.getElementById('theme-btn');

    function updateThemeButton(isLight) {
        if (themeBtn) themeBtn.textContent = isLight ? '☀️' : '🌙';
    }

    function setTheme(isLight) {
        if (isLight) {
            document.documentElement.classList.add('light-mode');
            document.body.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.remove('light-mode');
            document.body.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeButton(isLight);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.contains('light-mode');
        setTheme(!isLight);
    }

    const savedThemeInitial = localStorage.getItem('theme');
    const systemPrefersDarkInitial = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isLightInitial = (savedThemeInitial === 'light') || (!savedThemeInitial && !systemPrefersDarkInitial);
    if (isLightInitial) {
        document.documentElement.classList.add('light-mode');
        document.body.classList.add('light-mode');
    }
    updateThemeButton(isLightInitial);

    // Listeyi Ekrana Basma
    function renderList(filterCat = 'all') {
        const listContainer = document.getElementById('contentList');
        listContainer.innerHTML = '';

        let filtered = siyerData;
        if (filterCat !== 'all') {
            filtered = siyerData.filter(item => item.category === filterCat);
        }

        filtered.forEach(item => {
            let title = item.titleTr;
            let badge = item.badgeTr;
            let desc = item.descTr;

            if (activeLang === 'en') {
                title = item.titleEn; badge = item.badgeEn; desc = item.descEn;
            } else if (activeLang === 'ar') {
                title = item.titleAr; badge = item.badgeAr; desc = item.descAr;
            }

            const card = document.createElement('div');
            card.className = 'siyer-card';
            card.onclick = () => openDetail(item.id);
            card.innerHTML = `
                <div class="siyer-card-title">
                    ${title}
                    <span class="badge">${badge}</span>
                </div>
                <div class="siyer-card-desc">${desc}</div>
            `;
            listContainer.appendChild(card);
        });
    }

    function filterCategory(cat, btnElem) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElem.classList.add('active');
        renderList(cat);
    }

    function openDetail(id) {
        const item = siyerData.find(i => i.id === id);
        if (!item) return;

        let title = item.titleTr;
        let content = item.contentTr;

        if (activeLang === 'en') {
            title = item.titleEn; content = item.contentEn;
        } else if (activeLang === 'ar') {
            title = item.titleAr; content = item.contentAr;
        }

        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerText = content;
        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    function closeModalOutside(e) {
        if (e.target.id === 'detailModal') closeModal();
    }

    window.onload = () => {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.innerHTML = t[key];
            }
        });

        renderList('all');
    };
</script>

</body>
</html>
