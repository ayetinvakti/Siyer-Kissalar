    <script>
        // Tema ve Özel Renk Paleti Kontrolü (Titremeyi önlemek için en başta çalışır)
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
            document.body && document.body.classList.add('light-mode');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;

            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px 40px 20px;

            max-height: 88vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow);

        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 2;
        }

            line-height: 1.7;

    const themeBtn = document.getElementById('theme-btn');

    function updateThemeButton(isLight) {
        if (themeBtn) themeBtn.textContent = isLight ? '☀️' : '🌙';
    }

    function setTheme(isLight) {
        if (isLight) {
            document.documentElement.classList.add('light-mode');
            document.body.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.remove('light-mode');
            document.body.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeButton(isLight);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.contains('light-mode');
        setTheme(!isLight);
    }

    const savedThemeInitial = localStorage.getItem('theme');
    const systemPrefersDarkInitial = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isLightInitial = (savedThemeInitial === 'light') || (!savedThemeInitial && !systemPrefersDarkInitial);
    if (isLightInitial) {
        document.documentElement.classList.add('light-mode');
        document.body.classList.add('light-mode');
    }
    updateThemeButton(isLightInitial);

    let currentFilter = 'all';
    let searchQuery = '';

    // Listeyi Ekrana Basma (Çoklu Dil ve Arama Destekli)
    function renderList() {
        const listContainer = document.getElementById('contentList');
        listContainer.innerHTML = '';

        let filtered = siyerData.filter(item => {
            const matchesCategory = (currentFilter === 'all' || item.category === currentFilter);
            
            let title = item.titleTr;
            let desc = item.descTr;
            let content = item.contentTr;

            if (activeLang === 'en') {
                title = item.titleEn; desc = item.descEn; content = item.contentEn;
            } else if (activeLang === 'ar') {
                title = item.titleAr; desc = item.descAr; content = item.contentAr;
            }

            const matchesSearch = title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                  desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                  content.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:30px; font-size:0.9rem;">Aradığınız kriterde konu bulunamadı.</div>';
            return;
        }

        filtered.forEach(item => {
            let title = item.titleTr;
            let badge = item.badgeTr;
            let desc = item.descTr;

            if (activeLang === 'en') {
                title = item.titleEn; badge = item.badgeEn; desc = item.descEn;
            } else if (activeLang === 'ar') {
                title = item.titleAr; badge = item.badgeAr; desc = item.descAr;
            }

            const card = document.createElement('div');
            card.className = 'siyer-card';
            card.onclick = () => openDetail(item.id);
            card.innerHTML = `
                <div class="siyer-card-title">
                    ${title}
                    <span class="badge">${badge}</span>
                </div>
                <div class="siyer-card-desc">${desc}</div>
            `;
            listContainer.appendChild(card);
        });
    }

    function filterCategory(cat, btnElem) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElem.classList.add('active');
        currentFilter = cat;
        renderList();
    }

    function handleSearch() {
        searchQuery = document.getElementById('searchInput').value;
        renderList();
    }

    function openDetail(id) {
        const item = siyerData.find(i => i.id === id);
        if (!item) return;

        let title = item.titleTr;
        let content = item.contentTr;

        if (activeLang === 'en') {
            title = item.titleEn; content = item.contentEn;
        } else if (activeLang === 'ar') {
            title = item.titleAr; content = item.contentAr;
        }

        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerText = content;
        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    function closeModalOutside(e) {
        if (e.target.id === 'detailModal') closeModal();
    }

    window.onload = () => {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.innerHTML = t[key];
            }
        });

        renderList();
    };
</script>
