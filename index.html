    <script>
        // Tema ve Özel Renk Paleti Kontrolü (Titremeyi önlemek için en başta çalışır)
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
            document.body && document.body.classList.add('light-mode');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        html.light-mode, body.light-mode {

            --card-bg: #ffffff;
            --accent-color: #059669;
            --accent-hover: #047857;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;

            padding: 0;

        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            position: relative;
        }

        [dir="rtl"] .navbar {
            flex-direction: row-reverse;
        }

        .nav-right-group {
            display: flex;
            gap: 8px;
        }

        .home-btn, .theme-icon-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover, .theme-icon-btn:hover {
            background-color: var(--btn-hover);
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.7rem;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        /* Arama Kutusu */
        .search-box {
            width: 100%;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            outline: none;
            box-shadow: var(--shadow);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* Sekmeler / Kategoriler */
        .category-tabs {
            width: 100%;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        /* Konu Listesi Kartları */
        .content-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .siyer-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.1s ease;
        }

        .siyer-card:active {
            transform: scale(0.98);
        }

        .siyer-card-title {
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .siyer-card-title span.badge {
            font-size: 0.68rem;
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 8px;
            color: var(--accent-color);
            font-weight: 500;
        }

        .siyer-card-desc {
            font-size: 0.84rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Detay Okuma Modal / Paneli */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
        }

        .modal-sheet {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px 40px 20px;
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 2;
        }

        .modal-title-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-color);
            padding-right: 10px;
        }

        .close-modal-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .modal-body-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-color);
            white-space: pre-line;
        }
    </style>
</head>

            document.body.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.remove('light-mode');
            document.body.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeButton(isLight);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.contains('light-mode');
        setTheme(!isLight);
    }

    const savedThemeInitial = localStorage.getItem('theme');
    const systemPrefersDarkInitial = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isLightInitial = (savedThemeInitial === 'light') || (!savedThemeInitial && !systemPrefersDarkInitial);
    if (isLightInitial) {
        document.documentElement.classList.add('light-mode');
        document.body.classList.add('light-mode');
    }
    updateThemeButton(isLightInitial);

    let currentFilter = 'all';
    let searchQuery = '';

    // Listeyi Ekrana Basma (Çoklu Dil ve Arama Destekli)
    function renderList() {
        const listContainer = document.getElementById('contentList');
        listContainer.innerHTML = '';

        let filtered = siyerData.filter(item => {
            const matchesCategory = (currentFilter === 'all' || item.category === currentFilter);
            
            let title = item.titleTr;
            let desc = item.descTr;
            let content = item.contentTr;

            if (activeLang === 'en') {
                title = item.titleEn; desc = item.descEn; content = item.contentEn;
            } else if (activeLang === 'ar') {
                title = item.titleAr; desc = item.descAr; content = item.contentAr;
            }

            const matchesSearch = title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                  desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                  content.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:30px; font-size:0.9rem;">Aradığınız kriterde konu bulunamadı.</div>';
            return;
        }

        filtered.forEach(item => {
            let title = item.titleTr;
            let badge = item.badgeTr;
            let desc = item.descTr;

            if (activeLang === 'en') {
                title = item.titleEn; badge = item.badgeEn; desc = item.descEn;
            } else if (activeLang === 'ar') {
                title = item.titleAr; badge = item.badgeAr; desc = item.descAr;
            }

            const card = document.createElement('div');
            card.className = 'siyer-card';
            card.onclick = () => openDetail(item.id);
            card.innerHTML = `
                <div class="siyer-card-title">
                    ${title}
                    <span class="badge">${badge}</span>
                </div>
                <div class="siyer-card-desc">${desc}</div>
            `;
            listContainer.appendChild(card);
        });
    }

    function filterCategory(cat, btnElem) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElem.classList.add('active');
        currentFilter = cat;
        renderList();
    }

    function handleSearch() {
        searchQuery = document.getElementById('searchInput').value;
        renderList();
    }

    function openDetail(id) {
        const item = siyerData.find(i => i.id === id);
        if (!item) return;

        let title = item.titleTr;
        let content = item.contentTr;

        if (activeLang === 'en') {
            title = item.titleEn; content = item.contentEn;
        } else if (activeLang === 'ar') {
            title = item.titleAr; content = item.contentAr;
        }

        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerText = content;
        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    function closeModalOutside(e) {
        if (e.target.id === 'detailModal') closeModal();
    }

    window.onload = () => {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.innerHTML = t[key];
            }
        });

        renderList();
    };
</script>

</body>
</html>
